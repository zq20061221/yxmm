<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高速代理官方旗舰店</title>
    <meta name="description" content="隐姓埋名引导页">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Microsoft YaHei", Arial, sans-serif;
            color: #111827;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(37, 99, 235, 0.08), transparent 32%),
                linear-gradient(180deg, #f8fbff 0%, #ffffff 52%, #f6f8fb 100%);
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 42px 18px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            padding: 34px 20px 26px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.08);
        }

        .avatar {
            width: 96px;
            height: 96px;
            margin: 0 auto 18px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #1d8cff, #27c2ff);
            box-shadow: 0 14px 32px rgba(37, 99, 235, 0.18);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center center;
            border-radius: 50%;
            border: 3px solid #ffffff;
        }

        .title {
            text-align: center;
            font-size: 30px;
            line-height: 1.25;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: 0.5px;
        }

        .subtitle {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
            line-height: 1.7;
            color: #64748b;
        }

        .tag {
            width: fit-content;
            margin: 16px auto 0;
            padding: 7px 13px;
            border-radius: 999px;
            background: #eef6ff;
            color: #1677ff;
            font-size: 13px;
            font-weight: 700;
        }

        .btn-list {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .guide-btn {
            width: 100%;
            min-height: 58px;
            padding: 0 16px;
            border-radius: 16px;
            background: #ffffff;
            border: 1px solid #e5edf7;
            color: #10213f;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
            transition: all 0.22s ease;
        }

        .guide-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(22, 136, 255, 0.38);
            box-shadow: 0 16px 32px rgba(37, 99, 235, 0.1);
        }

        .guide-btn:active {
            transform: scale(0.98);
        }

        .guide-btn.main {
            background: linear-gradient(135deg, #1688ff, #06b6ff);
            border-color: transparent;
            color: #ffffff;
            box-shadow: 0 16px 34px rgba(22, 136, 255, 0.24);
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .btn-icon {
            width: 38px;
            height: 38px;
            border-radius: 14px;
            background: #eef6ff;
            color: #1688ff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .guide-btn.main .btn-icon {
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
        }

        .btn-text {
            font-size: 16px;
            font-weight: 800;
            white-space: normal;
            word-break: break-word;
        }

        .btn-arrow {
            width: 28px;
            height: 28px;
            margin-left: 12px;
            border-radius: 50%;
            background: #f3f8ff
