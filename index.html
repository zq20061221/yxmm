<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Microsoft YaHei", Arial, sans-serif;
            color: #14233f;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 12% 15%, rgba(36, 132, 255, 0.22), transparent 28%),
                radial-gradient(circle at 90% 18%, rgba(0, 188, 255, 0.20), transparent 30%),
                radial-gradient(circle at 50% 100%, rgba(72, 139, 255, 0.14), transparent 38%),
                linear-gradient(180deg, #f8fbff 0%, #edf6ff 100%);
        }

        .page {
            width: 100%;
            padding: 24px 14px;
            position: relative;
        }

        .bg-light {
            position: fixed;
            border-radius: 999px;
            pointer-events: none;
            z-index: 0;
        }

        .bg-light-1 {
            width: 180px;
            height: 180px;
            left: -80px;
            top: 90px;
            background: rgba(22, 136, 255, 0.12);
            filter: blur(2px);
        }

        .bg-light-2 {
            width: 220px;
            height: 220px;
            right: -100px;
            bottom: 120px;
            background: rgba(0, 183, 255, 0.12);
            filter: blur(2px);
        }

        .card {
            width: 100%;
            max-width: 470px;
            margin: 0 auto;
            padding: 22px 18px 24px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow:
                0 24px 70px rgba(34, 118, 255, 0.16),
                inset 0 0 0 1px rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(18px);
            position: relative;
            overflow: hidden;
            z-index: 2;
        }

        .card::before {
            content: "";
            position: absolute;
            left: 50%;
            top: -150px;
            width: 320px;
            height: 320px;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(37, 133, 255, 0.22), transparent 68%);
            pointer-events: none;
        }

        .banner {
            height: 142px;
            border-radius: 24px;
            background:
                linear-gradient(135deg, rgba(18, 132, 255, 0.98), rgba(0, 184, 255, 0.90)),
                radial-gradient(circle at 18% 20%, rgba(255, 255, 255, 0.32), transparent 34%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 18px 38px rgba(22, 136, 255, 0.24);
            z-index: 2;
        }

        .banner::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            right: -58px;
            top: -72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
        }

        .banner::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            left: -48px;
            bottom: -58px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
        }

        .banner-text {
            position: absolute;
            left: 22px;
            top: 24px;
            color: #ffffff;
            z-index: 4;
        }

        .banner-text strong {
            display: block;
            font-size: 23px;
            line-height: 1.2;
            font-weight: 800;
        }

        .banner-text span {
            display: block;
            margin-top: 8px;
            font-size: 13px;
            opacity: 0.88;
        }

        .banner-img {
            position: absolute;
            right: 8px;
            bottom: 2px;
            width: 180px;
            height: auto;
            z-index: 3;
        }

        .avatar {
            width: 86px;
            height: 86px;
            margin: 20px auto 14px;
            border-radius: 24px;
            overflow: hidden;
            background: #eaf4ff;
            box-shadow: 0 14px 34px rgba(23, 136, 255, 0.22);
            position: relative;
            z-index: 2;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center center;
        }

        .title {
            text-align: center;
            font-size: 28px;
            line-height: 1.25;
            font-weight: 900;
            color: #10213f;
            position: relative;
            z-index: 2;
        }

        .subtitle {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
            line-height: 1.7;
            color: #637491;
            position: relative;
            z-index: 2;
        }

        .btn-list {
            margin-top: 26px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            z-index: 2;
        }

        .guide-btn {
            width: 100%;
            min-height: 58px;
            padding: 0 18px 0 20px;
            border-radius: 18px;
            background: #ffffff;
            border: 1px solid rgba(32, 123, 255, 0.12);
            box-shadow: 0 10px 26px rgba(41, 113, 255, 0.08);
            color: #18345e;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s ease;
        }

        .guide-btn:hover {
            transform: translateY(-3px);
            border-color: rgba(32, 123, 255, 0.34);
            box-shadow: 0 16px 34px rgba(41, 113, 255, 0.16);
        }

        .guide-btn:active {
            transform: scale(0.98);
        }

        .guide-btn.main {
            background: linear-gradient(135deg, #1688ff, #00b7ff);
            color: #ffffff;
            border: none;
            box-shadow: 0 16px 34px rgba(22, 136, 255, 0.28);
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 13px;
            background: linear-gradient(135deg, #eaf4ff, #dceeff);
            color: #1688ff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .guide-btn.main .btn-icon {
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
        }

        .btn-text {
            font-size: 16px;
            font-weight: 800;
            word-break: break-word;
        }

        .btn-arrow {
            width: 28px;
            height: 28px;
            margin-left: 12px;
            border-radius: 50%;
            background: #f1f7ff;
            color: #1688ff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 22px;
            line-height: 1;
        }

        .guide-btn.main .btn-arrow {
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
        }

        .tip {
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 16px;
            background: #f4f9ff;
            color: #6a7a95;
            font-size: 13px;
            line-height: 1.7;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            color: #7a8ba6;
            position: relative;
            z-index: 2;
        }

        @media (max-width: 480px) {
            .page {

                border-radius: 24px;
            }

            .banner {

                padding-left: 16px;
                padding-right: 14px;
                border-radius: 17px;
            }

            .btn-text {
                font-size: 15px;
            }
        }
    </style>
