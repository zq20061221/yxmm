            background: #eef6ff;
            color: #1677ff;
            font-size: 13px;
            font-weight: 700;
        }

        .btn-list {

            gap: 13px;
        }

        .guide-btn {

            padding: 0 16px;
            border-radius: 16px;
            background: #ffffff;
            border: 1px solid #e5edf7;
            color: #10213f;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);

        }

        .guide-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(22, 136, 255, 0.38);
            box-shadow: 0 16px 32px rgba(37, 99, 235, 0.1);

            border-color: transparent;
            color: #ffffff;
            box-shadow: 0 16px 34px rgba(22, 136, 255, 0.24);
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .btn-icon {
            width: 38px;
            height: 38px;
            border-radius: 14px;
            background: #eef6ff;
            color: #1688ff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .guide-btn.main .btn-icon {

            color: #ffffff;
        }

        .btn-text {
            font-size: 16px;
            font-weight: 800;
            white-space: normal;
            word-break: break-word;
        }

        .btn-arrow {

            border-radius: 50%;
            background: #f3f8ff;
            color: #1688ff;

            line-height: 1;
